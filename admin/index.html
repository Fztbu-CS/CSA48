<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>!?猪猪?! · 本地管理后台</title>
  <link rel="icon" type="image/svg+xml" href="/pig.svg" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 主题初始化（避免闪烁）
    document.documentElement.setAttribute('data-theme', localStorage.getItem('admin-theme') || 'dark');
  </script>
</head>
<body class="flex min-h-screen flex-col bg-base-100 text-base-content antialiased">
  <!-- 顶栏 -->
  <header class="sticky top-0 z-40 border-b border-base-300 bg-base-100/90 backdrop-blur-md">
    <div class="navbar mx-auto min-h-16 max-w-7xl gap-4 px-4 sm:px-6 lg:px-8">
      <div class="navbar-start gap-3">
        <img src="/pig.svg" class="w-9 h-9 shrink-0" alt="Logo" />
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold sm:text-lg">!?猪猪?! · 本地管理后台</h1>
            <span class="badge badge-success badge-outline gap-1.5 shrink-0">
              <span class="h-1.5 w-1.5 rounded-full bg-success animate-pulse"></span>
              <span>数据直连</span>
            </span>
          </div>
          <p class="hidden text-[11px] text-base-content/60 sm:block">直接读写本地 src/data/shameData.json 与 public/avatars/</p>
        </div>
      </div>

      <div class="navbar-end gap-3">
        <a href="http://localhost:4321" target="_blank" class="btn btn-sm btn-outline hidden gap-1.5 sm:inline-flex">
          <span>查看前台排行榜</span>
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>

        <button id="theme-toggle" type="button" class="btn btn-ghost btn-circle" title="切换明暗色彩模式" aria-label="切换明暗色彩模式">
          <span id="admin-theme-icon-dark" class="hidden">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span id="admin-theme-icon-light">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主容器 -->
  <main class="mx-auto max-w-7xl w-full flex-1 space-y-6 px-4 py-6 sm:px-6 lg:px-8">
    <!-- 视图切换 -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-base-300 pb-4">
      <div class="tabs tabs-boxed bg-base-200">
        <button type="button" id="tab-btn-persons" class="tab tab-active gap-2" onclick="switchTab('persons')">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>人员档案管理</span>
          <span id="badge-persons-count" class="badge badge-sm">0</span>
        </button>
        <button type="button" id="tab-btn-incidents" class="tab gap-2" onclick="switchTab('incidents')">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>翻车事迹管理</span>
          <span id="badge-incidents-count" class="badge badge-sm">0</span>
        </button>
      </div>

      <button id="add-btn" onclick="openAddModal()" class="btn btn-primary gap-2">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="add-btn-label">添加新猪猪</span>
      </button>
    </div>

    <!-- 视图一：人员档案管理 -->
    <section id="view-persons" class="space-y-4">
      <label class="input input-bordered flex w-full max-w-md items-center gap-2 bg-base-100">
        <svg class="w-4 h-4 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-persons" class="grow" placeholder="搜索猪猪姓名、简介..." oninput="renderPersons()" />
      </label>

      <div id="persons-grid" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
        <!-- JS 渲染 -->
      </div>
    </section>

    <!-- 视图二：翻车事迹管理 -->
    <section id="view-incidents" class="hidden space-y-4">
      <div class="flex flex-col items-center gap-3 sm:flex-row">
        <label class="input input-bordered flex w-full items-center gap-2 bg-base-100 sm:max-w-md sm:flex-1">
          <svg class="w-4 h-4 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-incidents" class="grow" placeholder="搜索事迹标题、案发内容..." oninput="renderIncidents()" />
        </label>

        <select id="filter-incident-person" onchange="renderIncidents()" class="select select-bordered w-full bg-base-100 sm:w-56">
          <option value="all">全部猪猪</option>
        </select>
      </div>

      <div id="incidents-list" class="space-y-3">
        <!-- JS 渲染 -->
      </div>
    </section>
  </main>

  <!-- 人员新增 / 编辑弹窗 -->
  <dialog id="modal-person" class="modal">
    <div class="modal-box max-w-lg">
      <div class="mb-4 flex items-center justify-between border-b border-base-300 pb-4">
        <h3 id="modal-person-title" class="text-lg font-bold">添加新猪猪</h3>
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost" aria-label="关闭">✕</button>
        </form>
      </div>

      <form id="form-person" onsubmit="handleSavePerson(event)" class="space-y-4">
        <input type="hidden" id="person-form-id" value="" />

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-semibold">猪猪真实姓名 / 称呼 *</span>
          </div>
          <input
            type="text"
            id="person-form-name"
            required
            placeholder="例如：张三"
            oninput="updateAvatarPreview()"
            class="input input-bordered"
          />
        </label>

        <!-- 头像设置 -->
        <div class="space-y-3 rounded-box border border-base-300 bg-base-200 p-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold">人员头像设置</span>
            <span class="text-[11px] text-base-content/60">支持本地图片上传 / URL / 汉字</span>
          </div>

          <div class="flex items-center gap-4">
            <div class="avatar placeholder shrink-0">
              <div id="person-avatar-preview" class="w-16 rounded-xl bg-neutral text-neutral-content text-2xl font-black">
                <span>张</span>
              </div>
            </div>

            <div class="flex-1 space-y-2">
              <input type="hidden" id="person-form-avatar" value="" />

              <div class="flex flex-wrap items-center gap-2">
                <label class="btn btn-sm btn-secondary gap-1.5">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <span>选择本地头像图片</span>
                  <input type="file" id="person-file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event)" />
                </label>
                <button type="button" onclick="clearAvatarToInitial()" class="btn btn-sm btn-ghost">
                  重置为单字
                </button>
              </div>

              <input
                type="text"
                id="person-form-avatar-url"
                placeholder="或输入外部图片 URL (https://...)"
                oninput="handleAvatarUrlInput(this.value)"
                class="input input-bordered input-sm w-full"
              />
            </div>
          </div>
        </div>

        <div class="modal-action">
          <button type="button" onclick="closePersonModal()" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存人员档案</button>
        </div>
      </form>
    </div>

    <form method="dialog" class="modal-backdrop">
      <button>关闭</button>
    </form>
  </dialog>

  <!-- 事迹新增 / 编辑弹窗 -->
  <dialog id="modal-incident" class="modal">
    <div class="modal-box max-w-lg">
      <div class="mb-4 flex items-center justify-between border-b border-base-300 pb-4">
        <h3 id="modal-incident-title" class="text-lg font-bold">登记新翻车事迹</h3>
        <form method="dialog">
          <button class="btn btn-sm btn-circle btn-ghost" aria-label="关闭">✕</button>
        </form>
      </div>

      <form id="form-incident" onsubmit="handleSaveIncident(event)" class="space-y-4">
        <input type="hidden" id="incident-form-id" value="" />

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-semibold">猪猪 *</span>
          </div>
          <select id="incident-form-person" required class="select select-bordered">
            <!-- JS 渲染选项 -->
          </select>
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-semibold">案发日期 *</span>
          </div>
          <input type="date" id="incident-form-date" required class="input input-bordered" />
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-semibold">翻车事迹标题 *</span>
          </div>
          <input
            type="text"
            id="incident-form-title"
            required
            placeholder="简明扼要，如：生产数据库 Update 忘记带 WHERE 条件"
            class="input input-bordered"
          />
        </label>

        <label class="form-control w-full">
          <div class="label">
            <span class="label-text font-semibold">案发详细经过描述 *</span>
          </div>
          <textarea
            id="incident-form-desc"
            required
            rows="4"
            placeholder="详细经过、造成的乌龙影响或戏剧性场面..."
            class="textarea textarea-bordered leading-relaxed"
          ></textarea>
        </label>

        <div class="modal-action">
          <button type="button" onclick="closeIncidentModal()" class="btn btn-ghost">取消</button>
          <button type="submit" class="btn btn-primary">保存事迹</button>
        </div>
      </form>
    </div>

    <form method="dialog" class="modal-backdrop">
      <button>关闭</button>
    </form>
  </dialog>

  <!-- 操作提示 -->
  <div id="toast" class="toast toast-end hidden">
    <div id="toast-alert" class="alert alert-success">
      <span id="toast-icon">✓</span>
      <span id="toast-msg">操作成功</span>
    </div>
  </div>

  <script>
    let state = {
      persons: [],
      incidents: [],
      activeTab: 'persons',
    };

    // 是否为图片地址
    function isImageSrc(src) {
      if (!src) return false;
      const s = src.trim().toLowerCase();
      return (
        s.startsWith('http://') ||
        s.startsWith('https://') ||
        s.startsWith('data:image/') ||
        s.startsWith('/') ||
        s.endsWith('.png') ||
        s.endsWith('.jpg') ||
        s.endsWith('.jpeg') ||
        s.endsWith('.webp') ||
        s.endsWith('.gif') ||
        s.endsWith('.svg')
      );
    }

    // 头像（daisyUI avatar）
    function getAvatarHtml(avatar, name, innerClass = 'w-12 text-base') {
      const isImg = isImageSrc(avatar);
      const fallback = (!isImg && avatar && avatar.length <= 4) ? avatar : (name ? name[0] : '?');
      return `
        <div class="avatar placeholder shrink-0">
          <div class="${innerClass} rounded-xl bg-neutral text-neutral-content font-bold">
            ${isImg
              ? `<img src="${avatar}" alt="${name || ''}" onerror="this.parentElement.textContent='${fallback}'" />`
              : `<span>${fallback}</span>`}
          </div>
        </div>
      `;
    }

    // 操作提示（daisyUI toast / alert）
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');
      const alertEl = document.getElementById('toast-alert');
      if (!el || !msgEl) return;

      msgEl.textContent = msg;
      iconEl.textContent = isError ? '✕' : '✓';
      alertEl.className = isError ? 'alert alert-error' : 'alert alert-success';
      el.classList.remove('hidden');
      setTimeout(() => {
        el.classList.add('hidden');
      }, 2500);
    }

    // 读取本地数据
    async function loadData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        state.persons = data.persons || [];
        state.incidents = data.incidents || [];

        updateBadges();
        renderPersons();
        renderIncidents();
        populatePersonFilterDropdown();
      } catch (err) {
        console.error('Failed to load data:', err);
        showToast('读取本地数据失败，请检查服务是否运行', true);
      }
    }

    function updateBadges() {
      document.getElementById('badge-persons-count').textContent = state.persons.length;
      document.getElementById('badge-incidents-count').textContent = state.incidents.length;
    }

    // 视图切换
    function switchTab(tab) {
      state.activeTab = tab;
      const btnPersons = document.getElementById('tab-btn-persons');
      const btnIncidents = document.getElementById('tab-btn-incidents');
      const viewPersons = document.getElementById('view-persons');
      const viewIncidents = document.getElementById('view-incidents');
      const addBtnLabel = document.getElementById('add-btn-label');

      const activeClass = 'tab tab-active gap-2';
      const idleClass = 'tab gap-2';

      if (tab === 'persons') {
        btnPersons.className = activeClass;
        btnIncidents.className = idleClass;
        viewPersons.classList.remove('hidden');
        viewIncidents.classList.add('hidden');
        addBtnLabel.textContent = '添加新猪猪';
      } else {
        btnIncidents.className = activeClass;
        btnPersons.className = idleClass;
        viewPersons.classList.add('hidden');
        viewIncidents.classList.remove('hidden');
        addBtnLabel.textContent = '登记翻车事迹';
      }
    }

    function openAddModal() {
      if (state.activeTab === 'persons') {
        openPersonModal();
      } else {
        openIncidentModal();
      }
    }

    // ================= 人员档案 =================
    function renderPersons() {
      const container = document.getElementById('persons-grid');
      const q = (document.getElementById('search-persons')?.value || '').toLowerCase().trim();

      const filtered = state.persons.filter(p => {
        return !q || p.name.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        const emptyMsg = state.persons.length === 0
          ? '暂无猪猪档案，点击右上角“+ 添加新猪猪”开始录入吧~'
          : '未找到符合条件的猪猪';
        container.innerHTML = `<div class="col-span-full py-12 text-center text-xs text-base-content/60">${emptyMsg}</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const count = state.incidents.filter(i => i.personId === p.id).length;
        return `
          <div class="card card-bordered bg-base-200 shadow-sm transition-shadow hover:shadow-md">
            <div class="card-body gap-4 p-5">
              <div class="flex items-start justify-between gap-3">
                <div class="flex min-w-0 items-center gap-3">
                  ${getAvatarHtml(p.avatar, p.name, 'w-14 text-xl')}
                  <h4 class="truncate text-base font-bold">${p.name}</h4>
                </div>
                <span class="badge badge-secondary shrink-0 font-bold">${count} 次</span>
              </div>

              <div class="card-actions justify-end border-t border-base-300 pt-3">
                <button onclick="editPerson('${p.id}')" class="btn btn-sm btn-ghost gap-1">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                  <span>编辑</span>
                </button>
                <button onclick="deletePerson('${p.id}', '${p.name}', ${count})" class="btn btn-sm btn-error btn-outline gap-1">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  <span>删除</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPersonModal(person = null) {
      const modal = document.getElementById('modal-person');
      const titleEl = document.getElementById('modal-person-title');
      const idInput = document.getElementById('person-form-id');
      const nameInput = document.getElementById('person-form-name');
      const avatarInput = document.getElementById('person-form-avatar');
      const avatarUrlInput = document.getElementById('person-form-avatar-url');

      if (person) {
        titleEl.textContent = '编辑猪猪资料';
        idInput.value = person.id;
        nameInput.value = person.name;
        avatarInput.value = person.avatar || '';
        avatarUrlInput.value = isImageSrc(person.avatar) ? person.avatar : '';
      } else {
        titleEl.textContent = '添加新猪猪';
        idInput.value = '';
        nameInput.value = '';
        avatarInput.value = '';
        avatarUrlInput.value = '';
      }

      updateAvatarPreview();
      modal.showModal();
    }

    function closePersonModal() {
      document.getElementById('modal-person')?.close();
    }

    function editPerson(id) {
      const p = state.persons.find(item => item.id === id);
      if (p) openPersonModal(p);
    }

    async function deletePerson(id, name, count) {
      const confirmMsg = count > 0
        ? `确认删除人员【${name}】吗？\n注意：该人员关联的 ${count} 起翻车事迹也会一并清除！`
        : `确认删除人员【${name}】吗？`;

      if (!confirm(confirmMsg)) return;

      try {
        const res = await fetch('/api/person', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const result = await res.json();
        if (result.success) {
          showToast(`已删除人员【${name}】`);
          await loadData();
        } else {
          showToast(result.error || '删除失败', true);
        }
      } catch (err) {
        showToast('网络错误，删除失败', true);
      }
    }

    function updateAvatarPreview() {
      const name = document.getElementById('person-form-name')?.value || '';
      const avatarVal = document.getElementById('person-form-avatar')?.value || '';
      const previewBox = document.getElementById('person-avatar-preview');
      if (!previewBox) return;

      if (isImageSrc(avatarVal)) {
        previewBox.innerHTML = `<img src="${avatarVal}" onerror="this.parentElement.textContent='${name ? name[0] : '?'}'" />`;
      } else {
        previewBox.innerHTML = `<span>${avatarVal || (name ? name[0] : '?')}</span>`;
      }
    }

    function handleAvatarUrlInput(url) {
      const avatarInput = document.getElementById('person-form-avatar');
      if (avatarInput) {
        avatarInput.value = url.trim();
        updateAvatarPreview();
      }
    }

    function clearAvatarToInitial() {
      const avatarInput = document.getElementById('person-form-avatar');
      const avatarUrlInput = document.getElementById('person-form-avatar-url');
      if (avatarInput) avatarInput.value = '';
      if (avatarUrlInput) avatarUrlInput.value = '';
      updateAvatarPreview();
    }

    async function handleFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async () => {
        const dataUrl = reader.result;
        try {
          showToast('正在上传头像...');
          const res = await fetch('/api/upload-avatar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, dataUrl })
          });
          const result = await res.json();
          if (result.success) {
            document.getElementById('person-form-avatar').value = result.url;
            document.getElementById('person-form-avatar-url').value = result.url;
            updateAvatarPreview();
            showToast('头像上传成功！');
          } else {
            showToast(result.error || '头像上传失败', true);
          }
        } catch (err) {
          showToast('头像上传失败: ' + err.message, true);
        }
      };
      reader.readAsDataURL(file);
    }

    async function handleSavePerson(e) {
      e.preventDefault();
      const id = document.getElementById('person-form-id').value;
      const name = document.getElementById('person-form-name').value;
      const avatar = document.getElementById('person-form-avatar').value;

      try {
        const res = await fetch('/api/person', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name, avatar })
        });
        const result = await res.json();
        if (result.success) {
          closePersonModal();
          showToast(id ? '人员资料修改成功' : '新增人员成功');
          await loadData();
        } else {
          showToast(result.error || '保存失败', true);
        }
      } catch (err) {
        showToast('网络错误，保存失败', true);
      }
    }

    // ================= 翻车事迹 =================
    function populatePersonFilterDropdown() {
      const select = document.getElementById('filter-incident-person');
      if (!select) return;
      const current = select.value;
      select.innerHTML = '<option value="all">全部猪猪</option>' +
        state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      select.value = current || 'all';
    }

    function renderIncidents() {
      const container = document.getElementById('incidents-list');
      const q = (document.getElementById('search-incidents')?.value || '').toLowerCase().trim();
      const personFilter = document.getElementById('filter-incident-person')?.value || 'all';

      // 按日期倒序
      const sorted = [...state.incidents].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

      const filtered = sorted.filter(inc => {
        const matchPerson = personFilter === 'all' || inc.personId === personFilter;
        const matchQuery = !q || inc.title.toLowerCase().includes(q) || inc.description.toLowerCase().includes(q);
        return matchPerson && matchQuery;
      });

      if (filtered.length === 0) {
        const emptyMsg = state.incidents.length === 0
          ? '暂无翻车事迹记录，点击右上角“+ 登记翻车事迹”开始录入吧~'
          : '未找到符合条件的翻车事迹';
        container.innerHTML = `<div class="py-12 text-center text-xs text-base-content/60">${emptyMsg}</div>`;
        return;
      }

      const personMap = new Map(state.persons.map(p => [p.id, p]));

      container.innerHTML = filtered.map(inc => {
        const person = personMap.get(inc.personId);
        return `
          <div class="card card-bordered bg-base-200 shadow-sm transition-shadow hover:shadow-md">
            <div class="card-body gap-3 p-5">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                  ${person ? getAvatarHtml(person.avatar, person.name, 'w-8 text-xs') : ''}
                  <span class="text-sm font-bold">${person ? person.name : '未知猪猪'}</span>
                </div>
                <span class="badge badge-ghost font-mono">${inc.date}</span>
              </div>

              <h4 class="text-base font-bold">${inc.title}</h4>
              <p class="rounded-box border border-base-300 bg-base-100 p-3 text-xs leading-relaxed">
                ${inc.description}
              </p>

              <div class="card-actions justify-end border-t border-base-300 pt-2">
                <button onclick="editIncident('${inc.id}')" class="btn btn-sm btn-ghost gap-1">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                  <span>编辑</span>
                </button>
                <button onclick="deleteIncident('${inc.id}', '${inc.title}')" class="btn btn-sm btn-error btn-outline gap-1">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  <span>删除</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openIncidentModal(incident = null) {
      const modal = document.getElementById('modal-incident');
      const titleEl = document.getElementById('modal-incident-title');
      const idInput = document.getElementById('incident-form-id');
      const personSelect = document.getElementById('incident-form-person');
      const dateInput = document.getElementById('incident-form-date');
      const titleInput = document.getElementById('incident-form-title');
      const descInput = document.getElementById('incident-form-desc');

      personSelect.innerHTML = state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

      if (incident) {
        titleEl.textContent = '编辑翻车事迹';
        idInput.value = incident.id;
        personSelect.value = incident.personId;
        dateInput.value = incident.date;
        titleInput.value = incident.title;
        descInput.value = incident.description;
      } else {
        titleEl.textContent = '登记新翻车事迹';
        idInput.value = '';
        if (state.persons[0]) personSelect.value = state.persons[0].id;
        dateInput.value = new Date().toISOString().split('T')[0];
        titleInput.value = '';
        descInput.value = '';
      }

      modal.showModal();
    }

    function closeIncidentModal() {
      document.getElementById('modal-incident')?.close();
    }

    function editIncident(id) {
      const inc = state.incidents.find(i => i.id === id);
      if (inc) openIncidentModal(inc);
    }

    async function deleteIncident(id, title) {
      if (!confirm(`确认删除事迹【${title}】吗？`)) return;

      try {
        const res = await fetch('/api/incident', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const result = await res.json();
        if (result.success) {
          showToast('事迹已删除');
          await loadData();
        } else {
          showToast(result.error || '删除失败', true);
        }
      } catch (err) {
        showToast('网络错误，删除失败', true);
      }
    }

    async function handleSaveIncident(e) {
      e.preventDefault();
      const id = document.getElementById('incident-form-id').value;
      const personId = document.getElementById('incident-form-person').value;
      const date = document.getElementById('incident-form-date').value;
      const title = document.getElementById('incident-form-title').value;
      const description = document.getElementById('incident-form-desc').value;

      try {
        const res = await fetch('/api/incident', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, personId, date, title, description })
        });
        const result = await res.json();
        if (result.success) {
          closeIncidentModal();
          showToast(id ? '事迹修改成功' : '新事迹录入成功');
          await loadData();
        } else {
          showToast(result.error || '保存失败', true);
        }
      } catch (err) {
        showToast('网络错误，保存失败', true);
      }
    }

    // 明暗主题切换
    const themeToggle = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('admin-theme-icon-dark');
    const lightIcon = document.getElementById('admin-theme-icon-light');

    function syncThemeIcons(theme) {
      darkIcon.classList.toggle('hidden', theme !== 'dark');
      lightIcon.classList.toggle('hidden', theme === 'dark');
    }

    syncThemeIcons(document.documentElement.getAttribute('data-theme') || 'dark');

    themeToggle.addEventListener('click', () => {
      const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('admin-theme', theme);
      syncThemeIcons(theme);
    });

    // 初始化
    loadData();
  </script>
</body>
</html>
