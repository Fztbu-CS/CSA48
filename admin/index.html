<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>!?猪猪?! · 本地管理后台 (Material You)</title>
  <link rel="icon" type="image/svg+xml" href="/pig.svg" />
  
  <!-- Google Fonts: Google Sans & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN with M3 Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            md: {
              surface: 'var(--md-surface)',
              'surface-dim': 'var(--md-surface-dim)',
              'surface-bright': 'var(--md-surface-bright)',
              'surface-container-lowest': 'var(--md-surface-container-lowest)',
              'surface-container-low': 'var(--md-surface-container-low)',
              'surface-container': 'var(--md-surface-container)',
              'surface-container-high': 'var(--md-surface-container-high)',
              'surface-container-highest': 'var(--md-surface-container-highest)',
              'on-surface': 'var(--md-on-surface)',
              'on-surface-variant': 'var(--md-on-surface-variant)',
              outline: 'var(--md-outline)',
              'outline-variant': 'var(--md-outline-variant)',

              primary: 'var(--md-primary)',
              'on-primary': 'var(--md-on-primary)',
              'primary-container': 'var(--md-primary-container)',
              'on-primary-container': 'var(--md-on-primary-container)',

              secondary: 'var(--md-secondary)',
              'on-secondary': 'var(--md-on-secondary)',
              'secondary-container': 'var(--md-secondary-container)',
              'on-secondary-container': 'var(--md-on-secondary-container)',

              tertiary: 'var(--md-tertiary)',
              'on-tertiary': 'var(--md-on-tertiary)',
              'tertiary-container': 'var(--md-tertiary-container)',
              'on-tertiary-container': 'var(--md-on-tertiary-container)',

              error: 'var(--md-error)',
              'error-container': 'var(--md-error-container)',
              'on-error': 'var(--md-on-error)',
              'on-error-container': 'var(--md-on-error-container)',

              'inverse-surface': 'var(--md-inverse-surface)',
              'inverse-on-surface': 'var(--md-inverse-on-surface)',
              'inverse-primary': 'var(--md-inverse-primary)',
            },
          },
          borderRadius: {
            'md-xs': '4px',
            'md-sm': '8px',
            'md-md': '12px',
            'md-lg': '16px',
            'md-xl': '24px',
            'md-2xl': '28px',
            'md-3xl': '32px',
            'md-full': '9999px',
          },
          boxShadow: {
            'md-1': '0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.2)',
            'md-2': '0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.2)',
            'md-3': '0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.2)',
          },
          fontFamily: {
            sans: ['"Google Sans"', 'Roboto', 'system-ui', '-apple-system', 'sans-serif'],
          },
        },
      },
    };

    // Theme initialization
    const savedTheme = localStorage.getItem('admin-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <style>
    :root, [data-theme='light'] {
      color-scheme: light;
      --md-surface: #fff8f8;
      --md-surface-dim: #ded8e1;
      --md-surface-bright: #fff8f8;
      --md-surface-container-lowest: #ffffff;
      --md-surface-container-low: #fdf1f3;
      --md-surface-container: #f7ebed;
      --md-surface-container-high: #f2e5e7;
      --md-surface-container-highest: #ecdfe1;
      --md-on-surface: #22191b;
      --md-on-surface-variant: #514347;
      --md-outline: #847377;
      --md-outline-variant: #d5c2c6;

      --md-primary: #984061;
      --md-on-primary: #ffffff;
      --md-primary-container: #ffd9e2;
      --md-on-primary-container: #3e001d;

      --md-secondary: #74565f;
      --md-on-secondary: #ffffff;
      --md-secondary-container: #ffd9e2;
      --md-on-secondary-container: #2b151c;

      --md-tertiary: #7c5635;
      --md-on-tertiary: #ffffff;
      --md-tertiary-container: #ffdcbe;
      --md-on-tertiary-container: #2c1600;

      --md-error: #ba1a1a;
      --md-error-container: #ffdad6;
      --md-on-error: #ffffff;
      --md-on-error-container: #410002;

      --md-inverse-surface: #382e30;
      --md-inverse-on-surface: #feedee;
      --md-inverse-primary: #ffb0c8;
    }

    .dark, [data-theme='dark'] {
      color-scheme: dark;
      --md-surface: #191113;
      --md-surface-dim: #191113;
      --md-surface-bright: #413739;
      --md-surface-container-lowest: #130c0e;
      --md-surface-container-low: #22191c;
      --md-surface-container: #261d20;
      --md-surface-container-high: #31282a;
      --md-surface-container-highest: #3c3235;
      --md-on-surface: #efdfdf;
      --md-on-surface-variant: #d5c2c6;
      --md-outline: #9e8c90;
      --md-outline-variant: #514347;

      --md-primary: #ffb0c8;
      --md-on-primary: #5e1132;
      --md-primary-container: #7b2949;
      --md-on-primary-container: #ffd9e2;

      --md-secondary: #e2bdc6;
      --md-on-secondary: #422931;
      --md-secondary-container: #5a3f48;
      --md-on-secondary-container: #ffd9e2;

      --md-tertiary: #efbd94;
      --md-on-tertiary: #472a0b;
      --md-tertiary-container: #623f1f;
      --md-on-tertiary-container: #ffdcbe;

      --md-error: #ffb4ab;
      --md-error-container: #93000a;
      --md-on-error: #690005;
      --md-on-error-container: #ffdad6;

      --md-inverse-surface: #efdfdf;
      --md-inverse-on-surface: #382e30;
      --md-inverse-primary: #984061;
    }

    body {
      background-color: var(--md-surface);
      color: var(--md-on-surface);
      font-family: 'Google Sans', Roboto, system-ui, -apple-system, sans-serif;
      transition: background-color 0.25s cubic-bezier(0.2, 0, 0, 1), color 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .md-state-layer {
      position: relative;
      overflow: hidden;
      transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1);
    }
    .md-state-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: currentColor;
      opacity: 0;
      transition: opacity 0.2s cubic-bezier(0.2, 0, 0, 1);
      pointer-events: none;
      border-radius: inherit;
    }
    .md-state-layer:hover::after {
      opacity: 0.08;
    }
    .md-state-layer:active::after {
      opacity: 0.14;
    }

    dialog {
      border: none;
      background: transparent;
      padding: 0;
      margin: auto;
    }
    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
  </style>
</head>
<body class="flex min-h-screen flex-col bg-md-surface text-md-on-surface antialiased">
  <!-- M3 Top App Bar -->
  <header class="sticky top-0 z-40 border-b border-md-outline-variant/30 bg-md-surface/90 backdrop-blur-md">
    <div class="mx-auto flex h-16 sm:h-20 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <!-- Start: Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-md-xl bg-md-primary-container text-md-on-primary-container shadow-sm">
          <img src="/pig.svg" class="h-6 w-6" alt="Logo" />
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-md-on-surface sm:text-lg">!?猪猪?! · 本地管理后台</h1>
            <span class="inline-flex items-center gap-1.5 rounded-md-full bg-emerald-500/10 dark:bg-emerald-500/20 px-2.5 py-0.5 text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">
              <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>数据直连</span>
            </span>
          </div>
          <p class="hidden text-[11px] text-md-on-surface-variant sm:block">直接读写本地 src/data/shameData.json 与 public/avatars/</p>
        </div>
      </div>

      <!-- End: Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <a
          href="http://localhost:4321"
          target="_blank"
          class="md-state-layer hidden items-center gap-1.5 rounded-md-full border border-md-outline px-4 py-2 text-xs font-semibold text-md-primary hover:bg-md-primary/8 transition-colors sm:inline-flex"
        >
          <span>查看前台排行榜</span>
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </a>

        <button
          id="theme-toggle"
          type="button"
          class="md-state-layer flex h-10 w-10 items-center justify-center rounded-md-full text-md-on-surface-variant hover:bg-md-on-surface/8 hover:text-md-on-surface transition-colors"
          title="切换明暗色彩模式"
          aria-label="切换明暗色彩模式"
        >
          <span id="admin-theme-icon-dark" class="hidden">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </span>
          <span id="admin-theme-icon-light">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="mx-auto max-w-7xl w-full flex-1 space-y-6 px-4 py-6 sm:px-6 lg:px-8">
    <!-- Controls Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-md-outline-variant/30 pb-4">
      <!-- M3 Segmented Buttons -->
      <div class="flex items-center rounded-md-full border border-md-outline-variant/30 bg-md-surface-container-high p-1 shadow-sm">
        <button
          type="button"
          id="tab-btn-persons"
          class="flex items-center gap-2 rounded-md-full bg-md-secondary-container px-4 py-1.5 text-xs sm:text-sm font-semibold text-md-on-secondary-container shadow-sm transition-all"
          onclick="switchTab('persons')"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>人员档案管理</span>
          <span id="badge-persons-count" class="rounded-md-full bg-md-surface-container-highest px-2 py-0.5 text-[11px] font-bold">0</span>
        </button>
        <button
          type="button"
          id="tab-btn-incidents"
          class="flex items-center gap-2 rounded-md-full px-4 py-1.5 text-xs sm:text-sm font-medium text-md-on-surface-variant hover:text-md-on-surface hover:bg-md-on-surface/5 transition-all"
          onclick="switchTab('incidents')"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>翻车事迹管理</span>
          <span id="badge-incidents-count" class="rounded-md-full bg-md-surface-container-highest px-2 py-0.5 text-[11px] font-bold">0</span>
        </button>
      </div>

      <!-- Add Button -->
      <button
        id="add-btn"
        onclick="openAddModal()"
        class="md-state-layer flex items-center gap-2 rounded-md-full bg-md-primary px-5 py-2.5 text-xs sm:text-sm font-semibold text-md-on-primary shadow-md-1 hover:shadow-md-2 active:scale-[0.98] transition-all"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span id="add-btn-label">添加新猪猪</span>
      </button>
    </div>

    <!-- View 1: Persons -->
    <section id="view-persons" class="space-y-4">
      <label class="flex h-11 w-full max-w-md items-center gap-2.5 rounded-md-full border border-md-outline-variant/30 bg-md-surface-container-high px-4 text-sm text-md-on-surface shadow-sm focus-within:ring-2 focus-within:ring-md-primary transition-all">
        <svg class="h-4 w-4 shrink-0 text-md-on-surface-variant/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input
          type="text"
          id="search-persons"
          class="w-full bg-transparent outline-none placeholder:text-md-on-surface-variant/60"
          placeholder="搜索猪猪姓名、简介..."
          oninput="renderPersons()"
        />
      </label>

      <div id="persons-grid" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
        <!-- JS rendered -->
      </div>
    </section>

    <!-- View 2: Incidents -->
    <section id="view-incidents" class="hidden space-y-4">
      <div class="flex flex-col items-center gap-3 sm:flex-row">
        <label class="flex h-11 w-full items-center gap-2.5 rounded-md-full border border-md-outline-variant/30 bg-md-surface-container-high px-4 text-sm text-md-on-surface shadow-sm focus-within:ring-2 focus-within:ring-md-primary transition-all sm:max-w-md sm:flex-1">
          <svg class="h-4 w-4 shrink-0 text-md-on-surface-variant/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            type="text"
            id="search-incidents"
            class="w-full bg-transparent outline-none placeholder:text-md-on-surface-variant/60"
            placeholder="搜索事迹标题、案发内容..."
            oninput="renderIncidents()"
          />
        </label>

        <select
          id="filter-incident-person"
          onchange="renderIncidents()"
          class="h-11 w-full rounded-md-full border border-md-outline-variant/30 bg-md-surface-container-high px-4 text-xs font-medium text-md-on-surface outline-none transition-all focus:ring-2 focus:ring-md-primary sm:w-56 shadow-sm"
        >
          <option value="all">全部猪猪</option>
        </select>
      </div>

      <div id="incidents-list" class="space-y-3">
        <!-- JS rendered -->
      </div>
    </section>
  </main>

  <!-- Person Modal (M3 Dialog) -->
  <dialog id="modal-person" class="backdrop:bg-black/45 backdrop:backdrop-blur-sm p-4">
    <div class="mx-auto w-full max-w-lg rounded-md-3xl border border-md-outline-variant/30 bg-md-surface-container-high p-6 shadow-md-3 sm:p-8 text-md-on-surface">
      <div class="mb-5 flex items-center justify-between border-b border-md-outline-variant/20 pb-4">
        <h3 id="modal-person-title" class="text-lg font-bold text-md-on-surface">添加新猪猪</h3>
        <button
          type="button"
          onclick="closePersonModal()"
          class="md-state-layer flex h-9 w-9 items-center justify-center rounded-full text-md-on-surface-variant hover:bg-md-on-surface/8 hover:text-md-on-surface transition-colors"
        >
          ✕
        </button>
      </div>

      <form id="form-person" onsubmit="handleSavePerson(event)" class="space-y-4">
        <input type="hidden" id="person-form-id" value="" />

        <div>
          <label class="mb-1.5 block text-xs font-semibold text-md-on-surface">
            猪猪真实姓名 / 称呼 *
          </label>
          <input
            type="text"
            id="person-form-name"
            required
            placeholder="例如：张三"
            oninput="updateAvatarPreview()"
            class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest px-3.5 py-2.5 text-sm text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary placeholder:text-md-on-surface-variant/50"
          />
        </div>

        <!-- Avatar Config -->
        <div class="space-y-3 rounded-md-2xl border border-md-outline-variant/20 bg-md-surface-container p-4">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-md-on-surface">头像设置</span>
            <span class="text-[11px] text-md-on-surface-variant">支持本地图片上传 / URL / 汉字</span>
          </div>

          <div class="flex items-center gap-4">
            <div class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-full bg-md-primary-container text-2xl font-black text-md-on-primary-container shadow-sm">
              <div id="person-avatar-preview">
                <span>张</span>
              </div>
            </div>

            <div class="flex-1 space-y-2">
              <input type="hidden" id="person-form-avatar" value="" />

              <div class="flex flex-wrap items-center gap-2">
                <label class="md-state-layer flex items-center gap-1.5 rounded-md-full bg-md-secondary-container px-3.5 py-1.5 text-xs font-semibold text-md-on-secondary-container hover:shadow-sm cursor-pointer transition-all">
                  <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <span>选择本地头像</span>
                  <input type="file" id="person-file-input" accept="image/*" class="hidden" onchange="handleFileUpload(event)" />
                </label>
                <button
                  type="button"
                  onclick="clearAvatarToInitial()"
                  class="rounded-md-full border border-md-outline px-3 py-1.5 text-xs font-medium text-md-on-surface-variant hover:bg-md-on-surface/8 transition-colors"
                >
                  重置单字
                </button>
              </div>

              <input
                type="text"
                id="person-form-avatar-url"
                placeholder="或输入外部图片 URL (https://...)"
                oninput="handleAvatarUrlInput(this.value)"
                class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest px-3 py-1.5 text-xs text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary placeholder:text-md-on-surface-variant/50"
              />
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-2.5 pt-3 border-t border-md-outline-variant/20">
          <button
            type="button"
            onclick="closePersonModal()"
            class="rounded-md-full px-5 py-2 text-xs font-medium text-md-on-surface-variant hover:bg-md-on-surface/8 transition-colors"
          >
            取消
          </button>
          <button
            type="submit"
            class="md-state-layer rounded-md-full bg-md-primary px-6 py-2 text-xs font-semibold text-md-on-primary shadow-md-1 hover:shadow-md-2 active:scale-[0.98] transition-all"
          >
            保存人员档案
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Incident Modal (M3 Dialog) -->
  <dialog id="modal-incident" class="backdrop:bg-black/45 backdrop:backdrop-blur-sm p-4">
    <div class="mx-auto w-full max-w-lg rounded-md-3xl border border-md-outline-variant/30 bg-md-surface-container-high p-6 shadow-md-3 sm:p-8 text-md-on-surface">
      <div class="mb-5 flex items-center justify-between border-b border-md-outline-variant/20 pb-4">
        <h3 id="modal-incident-title" class="text-lg font-bold text-md-on-surface">登记新翻车事迹</h3>
        <button
          type="button"
          onclick="closeIncidentModal()"
          class="md-state-layer flex h-9 w-9 items-center justify-center rounded-full text-md-on-surface-variant hover:bg-md-on-surface/8 hover:text-md-on-surface transition-colors"
        >
          ✕
        </button>
      </div>

      <form id="form-incident" onsubmit="handleSaveIncident(event)" class="space-y-4">
        <input type="hidden" id="incident-form-id" value="" />

        <div>
          <label class="mb-1.5 block text-xs font-semibold text-md-on-surface">猪猪 *</label>
          <select
            id="incident-form-person"
            required
            class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest px-3.5 py-2.5 text-sm text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary"
          >
            <!-- Rendered by JS -->
          </select>
        </div>

        <div>
          <label class="mb-1.5 block text-xs font-semibold text-md-on-surface">案发日期 *</label>
          <input
            type="date"
            id="incident-form-date"
            required
            class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest px-3.5 py-2.5 text-sm text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-xs font-semibold text-md-on-surface">翻车事迹标题 *</label>
          <input
            type="text"
            id="incident-form-title"
            required
            placeholder="简明扼要，如：生产数据库 Update 忘记带 WHERE 条件"
            class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest px-3.5 py-2.5 text-sm text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary placeholder:text-md-on-surface-variant/50"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-xs font-semibold text-md-on-surface">案发详细经过描述 *</label>
          <textarea
            id="incident-form-desc"
            required
            rows="4"
            placeholder="详细经过、造成的乌龙影响或戏剧性场面..."
            class="w-full rounded-md-xl border border-md-outline-variant bg-md-surface-container-lowest p-3.5 text-sm leading-relaxed text-md-on-surface outline-none transition-all focus:border-md-primary focus:ring-1 focus:ring-md-primary placeholder:text-md-on-surface-variant/50"
          ></textarea>
        </div>

        <div class="flex justify-end gap-2.5 pt-3 border-t border-md-outline-variant/20">
          <button
            type="button"
            onclick="closeIncidentModal()"
            class="rounded-md-full px-5 py-2 text-xs font-medium text-md-on-surface-variant hover:bg-md-on-surface/8 transition-colors"
          >
            取消
          </button>
          <button
            type="submit"
            class="md-state-layer rounded-md-full bg-md-primary px-6 py-2 text-xs font-semibold text-md-on-primary shadow-md-1 hover:shadow-md-2 active:scale-[0.98] transition-all"
          >
            保存事迹
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- M3 Toast / Snackbar -->
  <div
    id="toast"
    class="fixed bottom-6 right-6 hidden z-50 rounded-md-xl border border-md-outline-variant/20 bg-md-inverse-surface text-md-inverse-on-surface px-5 py-3 shadow-md-3 items-center gap-2.5 text-xs font-medium transition-all animate-in fade-in slide-in-from-bottom-2 duration-200"
  >
    <span id="toast-icon" class="text-sm font-bold">✓</span>
    <span id="toast-msg">操作成功</span>
  </div>

  <script>
    let state = {
      persons: [],
      incidents: [],
      activeTab: 'persons',
    };

    function isImageSrc(src) {
      if (!src) return false;
      const s = src.trim().toLowerCase();
      return (
        s.startsWith('http://') ||
        s.startsWith('https://') ||
        s.startsWith('data:image/') ||
        s.startsWith('/') ||
        s.endsWith('.png') ||
        s.endsWith('.jpg') ||
        s.endsWith('.jpeg') ||
        s.endsWith('.webp') ||
        s.endsWith('.gif') ||
        s.endsWith('.svg')
      );
    }

    // Material 3 Avatar renderer
    function getAvatarHtml(avatar, name, sizeClass = 'h-12 w-12 text-base') {
      const isImg = isImageSrc(avatar);
      const fallback = (!isImg && avatar && avatar.length <= 4) ? avatar : (name ? name[0] : '?');
      return `
        <div class="flex ${sizeClass} shrink-0 items-center justify-center overflow-hidden rounded-full bg-md-primary-container text-md-on-primary-container font-bold shadow-xs">
          ${isImg
            ? `<img src="${avatar}" alt="${name || ''}" class="h-full w-full object-cover" onerror="this.parentElement.textContent='${fallback}'" />`
            : `<span>${fallback}</span>`}
        </div>
      `;
    }

    // Material 3 Snackbar Toast
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      const msgEl = document.getElementById('toast-msg');
      const iconEl = document.getElementById('toast-icon');
      if (!el || !msgEl) return;

      msgEl.textContent = msg;
      iconEl.textContent = isError ? '✕' : '✓';
      iconEl.className = isError ? 'text-red-400 font-bold' : 'text-emerald-400 font-bold';
      el.classList.remove('hidden');
      el.classList.add('flex');
      setTimeout(() => {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }, 2500);
    }

    // Read local data
    async function loadData() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        state.persons = data.persons || [];
        state.incidents = data.incidents || [];

        updateBadges();
        renderPersons();
        renderIncidents();
        populatePersonFilterDropdown();
      } catch (err) {
        console.error('Failed to load data:', err);
        showToast('读取本地数据失败，请检查服务是否运行', true);
      }
    }

    function updateBadges() {
      document.getElementById('badge-persons-count').textContent = state.persons.length;
      document.getElementById('badge-incidents-count').textContent = state.incidents.length;
    }

    // Tab switching
    function switchTab(tab) {
      state.activeTab = tab;
      const btnPersons = document.getElementById('tab-btn-persons');
      const btnIncidents = document.getElementById('tab-btn-incidents');
      const viewPersons = document.getElementById('view-persons');
      const viewIncidents = document.getElementById('view-incidents');
      const addBtnLabel = document.getElementById('add-btn-label');

      const activeClasses = ['bg-md-secondary-container', 'text-md-on-secondary-container', 'font-semibold', 'shadow-sm'];
      const idleClasses = ['text-md-on-surface-variant', 'font-medium'];

      if (tab === 'persons') {
        btnPersons.classList.add(...activeClasses);
        btnPersons.classList.remove(...idleClasses);
        btnIncidents.classList.remove(...activeClasses);
        btnIncidents.classList.add(...idleClasses);
        viewPersons.classList.remove('hidden');
        viewIncidents.classList.add('hidden');
        addBtnLabel.textContent = '添加新猪猪';
      } else {
        btnIncidents.classList.add(...activeClasses);
        btnIncidents.classList.remove(...idleClasses);
        btnPersons.classList.remove(...activeClasses);
        btnPersons.classList.add(...idleClasses);
        viewPersons.classList.add('hidden');
        viewIncidents.classList.remove('hidden');
        addBtnLabel.textContent = '登记翻车事迹';
      }
    }

    function openAddModal() {
      if (state.activeTab === 'persons') {
        openPersonModal();
      } else {
        openIncidentModal();
      }
    }

    // ================= Persons Section =================
    function renderPersons() {
      const container = document.getElementById('persons-grid');
      const q = (document.getElementById('search-persons')?.value || '').toLowerCase().trim();

      const filtered = state.persons.filter(p => {
        return !q || p.name.toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        const emptyMsg = state.persons.length === 0
          ? '暂无猪猪档案，点击右上角“+ 添加新猪猪”开始录入吧~'
          : '未找到符合条件的猪猪';
        container.innerHTML = `<div class="col-span-full rounded-md-3xl border border-md-outline-variant/30 bg-md-surface-container-low p-10 text-center text-xs text-md-on-surface-variant">${emptyMsg}</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const count = state.incidents.filter(i => i.personId === p.id).length;
        return `
          <div class="rounded-md-2xl border border-md-outline-variant/30 bg-md-surface-container-low p-5 shadow-sm hover:shadow-md-1 hover:bg-md-surface-container transition-all flex flex-col justify-between gap-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex min-w-0 items-center gap-3">
                ${getAvatarHtml(p.avatar, p.name, 'h-14 w-14 text-xl')}
                <div class="min-w-0">
                  <h4 class="truncate text-base font-bold text-md-on-surface">${p.name}</h4>
                  <p class="text-xs text-md-on-surface-variant">档案编号 #${p.id}</p>
                </div>
              </div>
              <span class="rounded-md-full bg-md-secondary-container px-3 py-0.5 text-xs font-bold text-md-on-secondary-container shrink-0">
                ${count} 次
              </span>
            </div>

            <div class="flex items-center justify-end gap-2 border-t border-md-outline-variant/20 pt-3">
              <button
                onclick="editPerson('${p.id}')"
                class="md-state-layer flex items-center gap-1 rounded-md-full border border-md-outline px-3.5 py-1 text-xs font-semibold text-md-primary hover:bg-md-primary/8 transition-colors"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <span>编辑</span>
              </button>
              <button
                onclick="deletePerson('${p.id}', '${p.name}', ${count})"
                class="md-state-layer flex items-center gap-1 rounded-md-full border border-red-500/40 px-3.5 py-1 text-xs font-semibold text-red-500 hover:bg-red-500/10 transition-colors"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>删除</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPersonModal(person = null) {
      const modal = document.getElementById('modal-person');
      const titleEl = document.getElementById('modal-person-title');
      const idInput = document.getElementById('person-form-id');
      const nameInput = document.getElementById('person-form-name');
      const avatarInput = document.getElementById('person-form-avatar');
      const avatarUrlInput = document.getElementById('person-form-avatar-url');

      if (person) {
        titleEl.textContent = '编辑猪猪资料';
        idInput.value = person.id;
        nameInput.value = person.name;
        avatarInput.value = person.avatar || '';
        avatarUrlInput.value = isImageSrc(person.avatar) ? person.avatar : '';
      } else {
        titleEl.textContent = '添加新猪猪';
        idInput.value = '';
        nameInput.value = '';
        avatarInput.value = '';
        avatarUrlInput.value = '';
      }

      updateAvatarPreview();
      modal.showModal();
    }

    function closePersonModal() {
      document.getElementById('modal-person')?.close();
    }

    function editPerson(id) {
      const p = state.persons.find(item => item.id === id);
      if (p) openPersonModal(p);
    }

    async function deletePerson(id, name, count) {
      const confirmMsg = count > 0
        ? `确认删除人员【${name}】吗？\n注意：该人员关联的 ${count} 起翻车事迹也会一并清除！`
        : `确认删除人员【${name}】吗？`;

      if (!confirm(confirmMsg)) return;

      try {
        const res = await fetch('/api/person', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const result = await res.json();
        if (result.success) {
          showToast(`已删除人员【${name}】`);
          await loadData();
        } else {
          showToast(result.error || '删除失败', true);
        }
      } catch (err) {
        showToast('网络错误，删除失败', true);
      }
    }

    function updateAvatarPreview() {
      const name = document.getElementById('person-form-name')?.value || '';
      const avatarVal = document.getElementById('person-form-avatar')?.value || '';
      const previewBox = document.getElementById('person-avatar-preview');
      if (!previewBox) return;

      if (isImageSrc(avatarVal)) {
        previewBox.innerHTML = `<img src="${avatarVal}" class="h-full w-full object-cover" onerror="this.parentElement.textContent='${name ? name[0] : '?'}'" />`;
      } else {
        previewBox.innerHTML = `<span>${avatarVal || (name ? name[0] : '?')}</span>`;
      }
    }

    function handleAvatarUrlInput(url) {
      const avatarInput = document.getElementById('person-form-avatar');
      if (avatarInput) {
        avatarInput.value = url.trim();
        updateAvatarPreview();
      }
    }

    function clearAvatarToInitial() {
      const avatarInput = document.getElementById('person-form-avatar');
      const avatarUrlInput = document.getElementById('person-form-avatar-url');
      if (avatarInput) avatarInput.value = '';
      if (avatarUrlInput) avatarUrlInput.value = '';
      updateAvatarPreview();
    }

    async function handleFileUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async () => {
        const dataUrl = reader.result;
        try {
          showToast('正在上传头像...');
          const res = await fetch('/api/upload-avatar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: file.name, dataUrl }),
          });
          const result = await res.json();
          if (result.success) {
            document.getElementById('person-form-avatar').value = result.url;
            document.getElementById('person-form-avatar-url').value = result.url;
            updateAvatarPreview();
            showToast('头像上传成功！');
          } else {
            showToast(result.error || '头像上传失败', true);
          }
        } catch (err) {
          showToast('头像上传失败: ' + err.message, true);
        }
      };
      reader.readAsDataURL(file);
    }

    async function handleSavePerson(e) {
      e.preventDefault();
      const id = document.getElementById('person-form-id').value;
      const name = document.getElementById('person-form-name').value;
      const avatar = document.getElementById('person-form-avatar').value;

      try {
        const res = await fetch('/api/person', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, name, avatar }),
        });
        const result = await res.json();
        if (result.success) {
          closePersonModal();
          showToast(id ? '人员资料修改成功' : '新增人员成功');
          await loadData();
        } else {
          showToast(result.error || '保存失败', true);
        }
      } catch (err) {
        showToast('网络错误，保存失败', true);
      }
    }

    // ================= Incidents Section =================
    function populatePersonFilterDropdown() {
      const select = document.getElementById('filter-incident-person');
      if (!select) return;
      const current = select.value;
      select.innerHTML = '<option value="all">全部猪猪</option>' +
        state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      select.value = current || 'all';
    }

    function renderIncidents() {
      const container = document.getElementById('incidents-list');
      const q = (document.getElementById('search-incidents')?.value || '').toLowerCase().trim();
      const personFilter = document.getElementById('filter-incident-person')?.value || 'all';

      const sorted = [...state.incidents].sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime());

      const filtered = sorted.filter(inc => {
        const matchPerson = personFilter === 'all' || inc.personId === personFilter;
        const matchQuery = !q || inc.title.toLowerCase().includes(q) || inc.description.toLowerCase().includes(q);
        return matchPerson && matchQuery;
      });

      if (filtered.length === 0) {
        const emptyMsg = state.incidents.length === 0
          ? '暂无翻车事迹记录，点击右上角“+ 登记翻车事迹”开始录入吧~'
          : '未找到符合条件的翻车事迹';
        container.innerHTML = `<div class="rounded-md-3xl border border-md-outline-variant/30 bg-md-surface-container-low p-10 text-center text-xs text-md-on-surface-variant">${emptyMsg}</div>`;
        return;
      }

      const personMap = new Map(state.persons.map(p => [p.id, p]));

      container.innerHTML = filtered.map(inc => {
        const person = personMap.get(inc.personId);
        return `
          <div class="rounded-md-2xl border border-md-outline-variant/30 bg-md-surface-container-low p-5 shadow-sm hover:shadow-md-1 hover:bg-md-surface-container transition-all space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <div class="flex items-center gap-2.5">
                ${person ? getAvatarHtml(person.avatar, person.name, 'h-8 w-8 text-xs') : ''}
                <span class="text-sm font-bold text-md-on-surface">${person ? person.name : '未知猪猪'}</span>
              </div>
              <span class="rounded-md-full border border-md-outline-variant/20 bg-md-surface-container-high px-3 py-1 font-mono text-xs text-md-on-surface-variant">
                ${inc.date}
              </span>
            </div>

            <h4 class="text-base font-bold text-md-on-surface">${inc.title}</h4>
            <p class="rounded-md-xl border border-md-outline-variant/20 bg-md-surface-container/60 p-3 text-xs leading-relaxed text-md-on-surface-variant">
              ${inc.description}
            </p>

            <div class="flex items-center justify-end gap-2 border-t border-md-outline-variant/20 pt-2">
              <button
                onclick="editIncident('${inc.id}')"
                class="md-state-layer flex items-center gap-1 rounded-md-full border border-md-outline px-3.5 py-1 text-xs font-semibold text-md-primary hover:bg-md-primary/8 transition-colors"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <span>编辑</span>
              </button>
              <button
                onclick="deleteIncident('${inc.id}', '${inc.title}')"
                class="md-state-layer flex items-center gap-1 rounded-md-full border border-red-500/40 px-3.5 py-1 text-xs font-semibold text-red-500 hover:bg-red-500/10 transition-colors"
              >
                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                <span>删除</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openIncidentModal(incident = null) {
      const modal = document.getElementById('modal-incident');
      const titleEl = document.getElementById('modal-incident-title');
      const idInput = document.getElementById('incident-form-id');
      const personSelect = document.getElementById('incident-form-person');
      const dateInput = document.getElementById('incident-form-date');
      const titleInput = document.getElementById('incident-form-title');
      const descInput = document.getElementById('incident-form-desc');

      personSelect.innerHTML = state.persons.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

      if (incident) {
        titleEl.textContent = '编辑翻车事迹';
        idInput.value = incident.id;
        personSelect.value = incident.personId;
        dateInput.value = incident.date;
        titleInput.value = incident.title;
        descInput.value = incident.description;
      } else {
        titleEl.textContent = '登记新翻车事迹';
        idInput.value = '';
        if (state.persons[0]) personSelect.value = state.persons[0].id;
        dateInput.value = new Date().toISOString().split('T')[0];
        titleInput.value = '';
        descInput.value = '';
      }

      modal.showModal();
    }

    function closeIncidentModal() {
      document.getElementById('modal-incident')?.close();
    }

    function editIncident(id) {
      const inc = state.incidents.find(i => i.id === id);
      if (inc) openIncidentModal(inc);
    }

    async function deleteIncident(id, title) {
      if (!confirm(`确认删除事迹【${title}】吗？`)) return;

      try {
        const res = await fetch('/api/incident', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const result = await res.json();
        if (result.success) {
          showToast('事迹已删除');
          await loadData();
        } else {
          showToast(result.error || '删除失败', true);
        }
      } catch (err) {
        showToast('网络错误，删除失败', true);
      }
    }

    async function handleSaveIncident(e) {
      e.preventDefault();
      const id = document.getElementById('incident-form-id').value;
      const personId = document.getElementById('incident-form-person').value;
      const date = document.getElementById('incident-form-date').value;
      const title = document.getElementById('incident-form-title').value;
      const description = document.getElementById('incident-form-desc').value;

      try {
        const res = await fetch('/api/incident', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, personId, date, title, description }),
        });
        const result = await res.json();
        if (result.success) {
          closeIncidentModal();
          showToast(id ? '事迹修改成功' : '新事迹录入成功');
          await loadData();
        } else {
          showToast(result.error || '保存失败', true);
        }
      } catch (err) {
        showToast('网络错误，保存失败', true);
      }
    }

    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('admin-theme-icon-dark');
    const lightIcon = document.getElementById('admin-theme-icon-light');

    function syncThemeIcons(theme) {
      darkIcon.classList.toggle('hidden', theme !== 'dark');
      lightIcon.classList.toggle('hidden', theme === 'dark');
    }

    syncThemeIcons(document.documentElement.getAttribute('data-theme') || 'dark');

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const theme = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('admin-theme', theme);
      syncThemeIcons(theme);
    });

    // Initialize
    loadData();
  </script>
</body>
</html>
